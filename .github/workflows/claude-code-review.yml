name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

# See Aethis-ai/aethis-workspace/docs/AUTOMATION_PATTERNS.md for the rules this follows.
# Kill switch: gh variable set CLAUDE_PR_REVIEW_ENABLED=false
# Master kill switch: gh variable set AI_AUTOMATIONS_ENABLED=false --org Aethis-ai

jobs:
  claude-review:
    if: vars.AI_AUTOMATIONS_ENABLED == 'true' && vars.CLAUDE_PR_REVIEW_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are reviewing a pull request on Aethis-ai/aethis-sdk-python — the official Python SDK for the Aethis API (Python 3.11+, httpx, pydantic).

            MODE: ${{ vars.CLAUDE_PR_REVIEW_MODE || 'dry-run' }}

            Prioritise these concerns above generic code-quality observations:

            1. **Type-signature drift** — any public-class method signature, Pydantic model field, or return-type change is potentially breaking for users who pinned types. Flag it and confirm there's a corresponding version bump.
            2. **SemVer discipline** — PyPI-published package: every change must bump the version source of truth (`_version.py` / `pyproject.toml`) AND update `CHANGELOG.md` in the SAME commit. Patch/minor/major per SemVer rules.
            3. **API client contract** — method names, parameter names, default values are all part of the public surface. Removal or rename is major. Additional optional params is minor.
            4. **Python compatibility** — the package supports 3.11+. Flag syntax or stdlib features that would break on 3.11 (e.g. 3.12-only features).
            5. **Standard** — type hints, async correctness, test coverage, conventional commits, no silent fallbacks.

            Use CLAUDE.md for repo-specific conventions.

            Post your review via `gh pr comment`. If MODE is 'dry-run', prefix the comment with a `[DRY-RUN]` heading and end it with: `_This is a dry-run review — informational only until the workflow is flipped to live._`

          claude_args: '--allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'
