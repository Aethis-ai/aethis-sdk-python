name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv pip install --system -e '.[dev]'

      - name: Ruff
        run: ruff check src tests scripts examples

      - name: Pytest (mocked PR gate — staging lane excluded via addopts; coverage floor here)
        run: pytest -v --cov=aethis_sdk --cov-report=term-missing --cov-fail-under=45

  hermetic:
    # Prove a first-time user with nothing configured can install and use the
    # built distribution: temporary HOME/XDG/cache, no Aethis or provider keys,
    # empty cache on first install, exact-digest artefact, offline smoke, and a
    # poisoned-artefact negative control that must fail. Runs across the
    # supported runtime / OS / architecture matrix (ubuntu = x86_64,
    # macos-14 = arm64).
    name: hermetic install (${{ matrix.os }} · py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # SOURCE_DATE_EPOCH pins the archive timestamps to the commit, which is
      # what makes the wheel byte-reproducible. Without it the "this commit
      # produced these bytes" leg of the integrity tuple is an assertion nobody
      # can re-derive.
      - name: Build the distribution reproducibly
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          export SOURCE_DATE_EPOCH
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"
          uv build

      # The wheel digest must be re-derivable, or the integrity tuple's source
      # leg is unverifiable. Guarded here rather than claimed in a doc.
      - name: Verify the wheel rebuilds byte-identically
        run: |
          set -euo pipefail
          before="$(shasum -a 256 dist/*.whl | awk '{print $1}')"
          rm -rf build src/*.egg-info rebuild
          uv build --wheel --out-dir rebuild
          after="$(shasum -a 256 rebuild/*.whl | awk '{print $1}')"
          if [[ "$before" != "$after" ]]; then
            echo "wheel is not reproducible: $before != $after" >&2
            exit 1
          fi
          echo "wheel reproducible: $before"
          rm -rf rebuild

      - name: Emit the release integrity tuple
        run: python scripts/release_integrity.py --out dist/integrity.json

      - name: Hermetic install + offline smoke + poisoned-artefact control
        run: |
          python scripts/hermetic_install_check.py \
            --dist dist \
            --integrity dist/integrity.json \
            --python "${{ matrix.python-version }}" \
            --timeout 600 \
            --json-out "hermetic-${{ matrix.os }}-${{ matrix.python-version }}.json"

      - name: Upload hermetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermetic-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            hermetic-*.json
            dist/integrity.json
