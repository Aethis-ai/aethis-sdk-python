name: Publish to PyPI

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches pyproject version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PYPROJECT_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "$PYPROJECT_VERSION" != "$VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject.toml version $PYPROJECT_VERSION"
            exit 1
          fi

      # SOURCE_DATE_EPOCH pins archive timestamps to the tag's commit so the
      # wheel is byte-reproducible from the source commit alone. (The sdist is
      # not yet — recorded honestly in the integrity tuple.)
      - name: Build sdist and wheel reproducibly
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          export SOURCE_DATE_EPOCH
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check distribution
        run: twine check dist/*

      # The tuple P10 pins the candidate on: (package, version) -> exact
      # sdist/wheel sha256 -> source commit. Emitted before publication so the
      # digests are the ones built from this tag's protected-main commit, and
      # re-verified against PyPI after publication below.
      # Written OUTSIDE dist/ so the publish step uploads distributions only.
      - name: Emit release integrity tuple
        run: |
          set -euo pipefail
          python scripts/release_integrity.py --out integrity/integrity.json --require-clean
          {
            echo '### Release integrity'
            echo '```json'
            cat integrity/integrity.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: actions/upload-artifact@v4
        with:
          name: integrity
          path: integrity/integrity.json

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/aethis-sdk
    permissions:
      id-token: write  # trusted publishing via OIDC
      contents: write  # cut a GitHub Release (gh release create) after publish

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: integrity
          path: integrity/

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          fetch-tags: true
          path: source

      # Last gate before an IRREVERSIBLE action. A PyPI upload cannot be
      # recalled or replaced, so the bytes about to be published are re-hashed
      # against the tuple the build job recorded — after the artefact round-trip
      # through upload/download — while refusing is still free.
      - name: Verify the artefacts about to be published match the recorded tuple
        run: |
          set -euo pipefail
          python source/scripts/release_integrity.py \
            --expect integrity/integrity.json --dist dist --verify-files
          python source/scripts/release_integrity.py \
            --expect integrity/integrity.json --require-clean

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

      - name: Verify PyPI received release
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          for attempt in {1..12}; do
            PUBLISHED="$(python -c 'import json, urllib.request; print(json.load(urllib.request.urlopen("https://pypi.org/pypi/aethis-sdk/json", timeout=30))["info"]["version"])')"
            if [[ "$PUBLISHED" == "$VERSION" ]]; then
              echo "PyPI has aethis-sdk $VERSION"
              exit 0
            fi
            echo "PyPI reports $PUBLISHED, waiting for $VERSION (attempt $attempt/12)"
            sleep 10
          done
          exit 1

      # Post-publish: the bytes PyPI serves must be the bytes we built and
      # recorded, and a first-time user with nothing configured must be able to
      # install and use them from the registry alone.
      - name: Verify PyPI serves the exact recorded digests
        run: |
          set -euo pipefail
          python source/scripts/release_integrity.py \
            --expect integrity/integrity.json --verify-registry --timeout 60

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Hermetic registry install (no keys, empty cache, temporary HOME)
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          python source/scripts/hermetic_install_check.py \
            --registry --version "$VERSION" --timeout 600 \
            --json-out hermetic-registry.json

      - name: Attach release evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: |
            integrity/integrity.json
            hermetic-registry.json

      - name: Check out repo at the published tag (for CHANGELOG.md)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Cut GitHub Release from CHANGELOG
        # Introduce the subscribe-able GitHub Releases channel on aethis-sdk-python
        # (zero Releases before this): on every publish, create a Release for the
        # just-published tag with the matching CHANGELOG section as its notes.
        # Idempotent create-or-skip so a re-run never fails the publish.
        # `--verify-tag` refuses to mint a synthetic tag at HEAD — the Release only
        # ever attaches to the real published tag. The PyPI distribution is
        # `aethis-sdk` but the repo/tag is aethis-sdk-python / v<version>
        # (epic aethis-workspace#526, sub-issue #24).
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          VERSION="${TAG#v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping (idempotent)."
            exit 0
          fi
          NOTES_FILE="$(mktemp)"
          awk -v ver="$VERSION" '
            $0 ~ "^## " ver "([ (]|$)" { inblock=1; next }
            inblock && /^## / { exit }
            inblock { print }
          ' CHANGELOG.md > "$NOTES_FILE"
          if [[ ! -s "$NOTES_FILE" ]]; then
            echo "No CHANGELOG.md section found for version $VERSION; cannot cut a Release." >&2
            exit 1
          fi
          gh release create "$TAG" --title "$TAG" --notes-file "$NOTES_FILE" --verify-tag
          echo "Created GitHub Release $TAG."

      - name: Trigger workspace release sync
        env:
          WORKSPACE_SYNC_TOKEN: ${{ secrets.WORKSPACE_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${WORKSPACE_SYNC_TOKEN:-}" ]]; then
            echo "WORKSPACE_SYNC_TOKEN not configured; skipping workspace dispatch."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $WORKSPACE_SYNC_TOKEN" \
            https://api.github.com/repos/Aethis-ai/aethis-workspace/dispatches \
            -d "{\"event_type\":\"release-package-published\",\"client_payload\":{\"package\":\"aethis-sdk\",\"version\":\"${GITHUB_REF_NAME#v}\",\"tag\":\"$GITHUB_REF_NAME\"}}"
