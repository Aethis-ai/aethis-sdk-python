[project]
name = "aethis-sdk"
version = "0.9.0"
description = "Official Python SDK for the Aethis developer API — eligibility decisions and ruleset schemas"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Aethis", email = "eng@aethis.ai"}]
keywords = ["sdk", "eligibility", "rules-engine", "compliance", "aethis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.5.0",
]

[project.urls]
Homepage = "https://aethis.ai"
Repository = "https://github.com/Aethis-ai/aethis-sdk-python"
Documentation = "https://github.com/Aethis-ai/aethis-sdk-python#readme"
"Bug Tracker" = "https://github.com/Aethis-ai/aethis-sdk-python/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aethis_sdk = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# The mocked suite is the PR gate; the `staging` lane hits deployed staging with
# a real minted key and is excluded here (run explicitly with `-m staging`, or by
# the nightly staging-integration workflow). The coverage flags live in the CI
# command, not here, so an ordinary `pytest` / `uv run pytest` doesn't require
# pytest-cov (which is only in the `dev` extra) to be installed.
addopts = "-m 'not staging'"
markers = [
    "staging: hits the deployed staging engine with a freshly-minted key (needs Clerk creds)",
]

[tool.coverage.run]
source = ["aethis_sdk"]

[tool.ruff]
target-version = "py311"
line-length = 120
